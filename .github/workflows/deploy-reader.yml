name: Reader - Publish Static Site

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/Ktory.Core/**'
      - 'src/Ktory.Web/**'
      - 'src/Ktory.Runner/wwwroot/**'
      - 'samples/**'
      - 'src/Ktory.Highlighting/**'
      - 'src/Ktory.VSCode/syntaxes/**'
      - 'src/Ktory.VSCode/package.json'
      - 'src/Ktory.VSCode/pnpm-lock.yaml'
      - 'Directory.Build.*'
      - '.github/workflows/deploy-reader.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Publish Reader to deploy-reader
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: src/Ktory.VSCode/pnpm-lock.yaml
      - name: Install offline highlighting engine
        run: pnpm --dir src/Ktory.VSCode install --frozen-lockfile

      - name: Build Reader static files
        run: |
          dotnet publish src/Ktory.Web -c Release -o artifacts/reader

      - name: Publish Reader files to deploy-reader branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy-reader
          publish_dir: ./artifacts/reader/wwwroot
          commit_message: "chore(reader): publish static site from ${{ github.sha }}"
